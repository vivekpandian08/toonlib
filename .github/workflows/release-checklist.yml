name: Release Checklist

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.1.0)'
        required: true
        default: '1.1.0'

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov build twine
        pip install -e .
    
    - name: ✓ Run all tests
      run: |
        pytest tests/ -v --tb=short
        echo "✓ All tests passing"
    
    - name: ✓ Check code quality
      run: |
        python -m py_compile toonstream/*.py
        echo "✓ Code syntax valid"
    
    - name: ✓ Verify imports
      run: |
        python -c "import toonstream; from toonstream import encode, decode; print('✓ All imports working')"
    
    - name: ✓ Build distribution
      run: |
        python -m build
        echo "✓ Distribution built successfully"
    
    - name: ✓ Validate distribution
      run: |
        twine check dist/*
        echo "✓ Distribution valid"
    
    - name: ✓ Check version consistency
      run: |
        VERSION="${{ github.event.inputs.version }}"
        echo "Checking version consistency for v${VERSION}"
        grep -q "version = \"${VERSION}\"" pyproject.toml && echo "✓ pyproject.toml version correct" || exit 1
        grep -q "version=\"${VERSION}\"" setup.py && echo "✓ setup.py version correct" || exit 1
        grep -q "__version__ = \"${VERSION}\"" toonstream/__init__.py && echo "✓ __init__.py version correct" || exit 1
    
    - name: ✓ Check documentation
      run: |
        test -f README.md && echo "✓ README.md exists" || exit 1
        test -f RELEASE_NOTES_v1.0.0.md && echo "✓ RELEASE_NOTES exists" || exit 1
        test -f LICENSE && echo "✓ LICENSE exists" || exit 1
    
    - name: Print release checklist
      run: |
        echo ""
        echo "╔════════════════════════════════════════════════════════════╗"
        echo "║           RELEASE CHECKLIST FOR v${{ github.event.inputs.version }}                    ║"
        echo "╚════════════════════════════════════════════════════════════╝"
        echo ""
        echo "✅ All tests passing (130 tests)"
        echo "✅ Code quality checks passed"
        echo "✅ Imports verified"
        echo "✅ Distribution built"
        echo "✅ Distribution validated"
        echo "✅ Version consistency verified"
        echo "✅ Documentation complete"
        echo ""
        echo "Ready to release! Next steps:"
        echo "1. Create git tag: git tag v${{ github.event.inputs.version }}"
        echo "2. Push tag: git push origin v${{ github.event.inputs.version }}"
        echo "3. GitHub Actions will automatically:"
        echo "   - Run full test suite"
        echo "   - Build distribution"
        echo "   - Publish to PyPI"
        echo "   - Create GitHub release"
        echo ""
