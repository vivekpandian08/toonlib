name: Release & Publish

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.1.0)

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov build twine
        pip install -e .
    
    - name: Run full test suite
      run: |
        pytest tests/ -v --tb=short

  build:
    needs: verify
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build distribution
      run: python -m build
    
    - name: Check distribution integrity
      run: twine check dist/*
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: distributions
        path: dist/
        retention-days: 5

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: distributions
        path: dist/
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Twine
      run: pip install twine
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/* --skip-existing
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        release_name: ToonStream ${{ github.ref_name }}
        body: |
          # ToonStream ${{ github.ref_name }}
          
          Token-Oriented Object Notation (TOON)
          
          **Key Features:**
          - ✅ 38-55% token reduction for LLM applications
          - ✅ Lossless JSON conversion
          - ✅ Optional PyTorch tensor support
          - ✅ Zero external dependencies
          - ✅ 100% test coverage (130 tests passing)
          
          **What's New:**
          - Simplified `auto_mode` parameter for intelligent mode detection
          - Comprehensive testing for both normal and tensor modes
          - Production-ready with clean codebase
          
          See [RELEASE_NOTES_v1.0.0.md](https://github.com/vivekpandian08/toonstream/blob/main/RELEASE_NOTES_v1.0.0.md) for full details.
        files: dist/*
        draft: false
        prerelease: false

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
